name: Docker build (branches) + push to ECR (main)

on:
  push:
    branches:
      - "**"     # build on all branch pushes to catch breakage early
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC (ECR push job)
  contents: read

env:
  IMAGE_NAME: raiden-viz
  # NOTE (human): set AWS_ACCOUNT_ID to the TRI account that hosts the ECR repo.
  # AnyFile uses 682769330988 — reuse it only if raiden-viz lives in the same account.
  AWS_ACCOUNT_ID: "682769330988"
  AWS_REGION: us-west-2   # single region — our data (tri-ml-datasets-uw2) is us-west-2
  ECR_REPO: raiden-viz

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (no push)
        run: docker build -t "${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}" .

  push-to-ecr:
    # Only after merge to main.
    if: github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # TRI's OIDC credential action (same one AnyFile uses).
      - name: Get AWS Credentials
        uses: TRI-Actions/get-aws-credentials@v1
        with:
          account-id: ${{ env.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Build, tag and push to ECR
        run: |
          REG="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          docker build -t "${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}" .
          docker tag "${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}" "$REG:${{ steps.tags.outputs.sha_tag }}"
          docker tag "${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}" "$REG:latest"
          docker push "$REG:${{ steps.tags.outputs.sha_tag }}"
          docker push "$REG:latest"
