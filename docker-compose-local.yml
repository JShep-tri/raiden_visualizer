# Local development / verification: builds the image from this repo.
#
# The container reads S3 via AWS creds passed as env vars. TRI laptops use AWS
# SSO (not static keys), so export the current session into the env first —
# this resolves SSO, ~/.aws profiles, or env creds uniformly:
#
#   eval "$(aws configure export-credentials --format env)"
#   docker compose -f docker-compose-local.yml up --build
#   -> open http://localhost:8080/
#
# (docker itself may need sudo if you're not in the 'docker' group; if so, use
#  `sudo -E docker compose ...` so it keeps the exported creds.)
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: raiden-viz
    ports:
      - "8080:8080"
    environment:
      - CACHE_DIR=/app/cache
      - RAIDEN_S3_BUCKET=${RAIDEN_S3_BUCKET:-tri-ml-datasets-uw2}
      - RAIDEN_S3_PREFIX=${RAIDEN_S3_PREFIX:-raiden_datasets/raw}
      - RAIDEN_AWS_REGION=${RAIDEN_AWS_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    volumes:
      # Persist the decode cache across container restarts.
      - /tmp/raiden_viz_cache:/app/cache
    restart: always
    mem_limit: 8g
